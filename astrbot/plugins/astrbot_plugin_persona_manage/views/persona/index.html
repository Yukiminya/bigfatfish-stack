<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人设编辑器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb; --surface: #fff; --text: #182338; --muted: #526078;
      --border: #c8d1e0; --accent: #234fc2; --on-accent: #fff;
      --error-bg: #fde8e8; --error-text: #8e2323;
      --success-bg: #ddf4e7; --success-text: #19603a;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121722; --surface: #1b2332; --text: #eef2fa; --muted: #b2bfd4;
      --border: #45526a; --accent: #a6bfff; --on-accent: #111e40;
      --error-bg: #48252d; --error-text: #ffd0d2;
      --success-bg: #1f3d31; --success-text: #baf0d2;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 system-ui, sans-serif;
    }
    main { max-width: 1200px; margin: auto; padding: clamp(12px, 3vw, 28px); }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    h2 { margin: 0; font-size: 1rem; }
    fieldset { min-inline-size: 0; margin: 0; padding: 0; border: 0; }
    .notice { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; }
    #error { background: var(--error-bg); color: var(--error-text); white-space: pre-line; }
    #success { background: var(--success-bg); color: var(--success-text); }
    .toolbar, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .toolbar select { max-width: 100%; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 1.6fr 1.2fr; gap: 8px; }
    .metrics > div, .card, dialog {
      min-width: 0; padding: 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--surface);
    }
    dt, .muted { color: var(--muted); font-size: .875rem; }
    dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere; }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
    .editor { display: grid; gap: 10px; }
    .actions { justify-content: flex-end; }
    select, textarea, button {
      font: inherit; color: inherit; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px;
    }
    select, button { padding: 6px 10px; }
    button { cursor: pointer; }
    :is(select, textarea, button):disabled { opacity: .65; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    textarea {
      display: block; width: 100%; min-height: 360px; padding: 10px; resize: vertical;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    li span { overflow-wrap: anywhere; }
    dialog { width: min(420px, calc(100% - 24px)); color: var(--text); padding: 16px; }
    dialog::backdrop { background: rgb(0 0 0 / 55%); }
    #confirm-message { overflow-wrap: anywhere; }
    @media (width < 700px) {
      .metrics, .layout { grid-template-columns: minmax(0, 1fr); }
      .metrics > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; }
      .metrics dd { margin: 0; text-align: end; }
      textarea { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>人设编辑器</h1>
    <p id="error" class="notice" role="alert" hidden></p>
    <p id="success" class="notice" role="status" hidden></p>

    <fieldset id="controls" aria-label="人设编辑操作" disabled>
      <div class="toolbar">
        <label for="persona">人设</label>
        <select id="persona" disabled>
          <option value="">正在加载…</option>
        </select>
        <button id="retry" type="button" hidden>重试读取</button>
      </div>

      <dl class="metrics">
        <div><dt>字数</dt><dd id="chars">—</dd></div>
        <div><dt>行数</dt><dd id="lines">—</dd></div>
        <div><dt>估算 token</dt><dd id="tokens">—</dd></div>
        <div><dt>更新时间</dt><dd id="updated">—</dd></div>
        <div><dt>当前生效</dt><dd id="active">—</dd></div>
      </dl>

      <div class="layout">
        <section class="card editor">
          <h2><label for="prompt">系统提示词</label></h2>
          <textarea id="prompt" spellcheck="false" disabled></textarea>
          <div class="actions">
            <button id="save" class="primary" type="button" disabled>保存</button>
          </div>
        </section>

        <section class="card" aria-labelledby="history-title">
          <h2 id="history-title">历史记录</h2>
          <p id="history-note" class="muted">等待读取人设</p>
          <ul id="history"></ul>
        </section>
      </div>
    </fieldset>
  </main>

  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-message"></p>
    <form class="actions" method="dialog">
      <button value="cancel" autofocus>取消</button>
      <button id="confirm-submit" class="primary" value="accept">确认</button>
    </form>
  </dialog>

  <script>
    (() => {
      "use strict";

      const byId = (id) => document.getElementById(id);
      const controls = byId("controls");
      const select = byId("persona");
      const prompt = byId("prompt");
      const save = byId("save");
      const retry = byId("retry");
      const history = byId("history");
      const historyNote = byId("history-note");
      const errorBar = byId("error");
      const successBar = byId("success");
      const dialog = byId("confirm");
      const metrics = ["chars", "lines", "tokens", "updated", "active"].map(byId);
      const pluginName = "astrbot_plugin_persona_manage";

      // 官方 4.29.3 的后台会为这个视图的 bridge endpoint 补上插件名。
      let apiPrefix = location.pathname.startsWith(`/api/v1/plugins/${pluginName}/views/`)
        ? "" : `${pluginName}/`;
      let routeConfirmed = false;
      let bridge;
      let busy = false;
      let currentId = null;
      let retryId = "default";

      function reportError(label, error) {
        const line = `${label}：${error?.message || String(error)}`;
        errorBar.textContent = errorBar.hidden ? line : `${errorBar.textContent}\n${line}`;
        errorBar.hidden = false;
      }

      function reportSuccess(message) {
        successBar.textContent = message;
        successBar.hidden = false;
      }

      async function run(label, operation) {
        if (busy) return;
        busy = true;
        controls.disabled = true;
        errorBar.hidden = true;
        successBar.hidden = true;
        try {
          await operation();
        } catch (error) {
          reportError(`${label}失败`, error);
        } finally {
          prompt.disabled = save.disabled = currentId === null;
          controls.disabled = false;
          busy = false;
        }
      }

      async function readState(personaId) {
        const params = { persona_id: personaId };
        try {
          return await bridge.apiGet(apiPrefix + "state", params);
        } catch (error) {
          // 仅在首次读取遇到明确的路由缺失时试用另一种约定。
          if (routeConfirmed || (error?.message ?? error) !== "未找到该路由") throw error;
          reportError("首选读取路由失败", error);
          apiPrefix = apiPrefix ? "" : `${pluginName}/`;
          return await bridge.apiGet(apiPrefix + "state", params);
        }
      }

      function renderState(state) {
        const options = state.personas.map(({ persona_id }) => new Option(persona_id, persona_id));
        if (!options.some((option) => option.value === state.persona_id)) {
          const current = new Option(state.persona_id, state.persona_id);
          current.disabled = true;
          options.unshift(current);
        }
        select.replaceChildren(...options);
        select.value = currentId = state.persona_id;
        select.disabled = false;
        prompt.value = state.system_prompt;
        const values = [
          state.chars, state.lines, state.tokens_est, state.updated_at || "—",
          state.persona_id === state.active_persona_id ? "是" : "否",
        ];
        metrics.forEach((node, index) => { node.textContent = values[index]; });
      }

      function renderHistory(personaId, entries) {
        for (const { ts, chars } of entries) {
          const row = document.createElement("li");
          const details = document.createElement("span");
          details.textContent = `${ts} · ${chars} 字`;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "回滚";
          button.setAttribute("aria-label", `回滚到 ${ts}`);
          button.addEventListener("click", () => {
            void write("rollback", { persona_id: personaId, ts }, "回滚",
              `确认把「${personaId}」回滚到 ${ts}？此操作会覆盖当前提示词。`);
          });
          row.append(details, button);
          history.append(row);
        }
        historyNote.textContent = entries.length ? "" : "暂无历史记录";
        historyNote.hidden = entries.length > 0;
      }

      async function loadPersona(personaId, announce = true) {
        try {
          const state = await readState(personaId);
          routeConfirmed = true;
          renderState(state);
          retry.hidden = true;
        } catch (error) {
          reportError("读取人设失败", error);
          if (currentId !== null) {
            select.value = currentId;
          } else {
            if (select.disabled) select.options[0].textContent = "加载失败";
            retryId = personaId;
            retry.hidden = false;
          }
          return;
        }

        history.replaceChildren();
        historyNote.hidden = false;
        historyNote.textContent = "正在读取历史…";
        try {
          const entries = await bridge.apiGet(apiPrefix + "history", { persona_id: currentId });
          renderHistory(currentId, entries);
          if (announce) reportSuccess(`已加载人设「${currentId}」。`);
        } catch (error) {
          historyNote.textContent = "历史记录加载失败";
          reportError("读取历史失败", error);
        }
      }

      function ask(message, label) {
        byId("confirm-message").textContent = message;
        byId("confirm-submit").textContent = `确认${label}`;
        dialog.returnValue = "";
        dialog.showModal();
        return new Promise((resolve) => {
          dialog.addEventListener("close", () => resolve(dialog.returnValue === "accept"), { once: true });
        });
      }

      async function write(endpoint, body, label, message) {
        if (!(await ask(message, label))) return;
        await run(label, async () => {
          const result = await bridge.apiPost(apiPrefix + endpoint, body);
          if (result?.status !== "ok") {
            throw new Error(result?.message || "接口未返回成功状态");
          }
          reportSuccess(`已${label}人设「${body.persona_id}」。`);
          currentId = null;
          prompt.value = "";
          metrics.forEach((node) => { node.textContent = "—"; });
          history.replaceChildren();
          historyNote.hidden = false;
          historyNote.textContent = "等待读取人设";
          await loadPersona(body.persona_id, false);
        });
      }

      select.addEventListener("change", () => void run("加载", () => loadPersona(select.value)));
      retry.addEventListener("click", () => void run("加载", () => loadPersona(retryId)));
      save.addEventListener("click", () => {
        void write("save", { persona_id: currentId, system_prompt: prompt.value }, "保存",
          `确认保存人设「${currentId}」的系统提示词？`);
      });

      // SDK 注入位置在内联脚本之后，等整个文档解析完再读取它。
      window.addEventListener("DOMContentLoaded", () => {
        void run("初始化", async () => {
          bridge = window.AstrBotPluginView ?? window.AstrBotPluginPage;
          if (!bridge) throw new Error("未加载 AstrBot bridge，请从后台插件详情打开此页");
          const { isDark } = await bridge.ready();
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          await loadPersona("default");
        });
      }, { once: true });
    })();
  </script>
</body>
</html>
